<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago con Transferencia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f4f4f9;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .card {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            position: relative;
            box-sizing: border-box;
        }

        .logo-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 120px;
            height: auto;
        }

        .info-section {
            margin-bottom: 25px;
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .value {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .whatsapp-section {
            margin-top: 30px;
            text-align: center;
        }

        .whatsapp-link {
            display: inline-block;
            background-color: #25d366;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        .whatsapp-link:hover {
            background-color: #20ba5a;
        }
    </style>
</head>
<body>

    <h2>PAGO CON TRANSFERENCIA</h2>

    <div class="card">
        <div class="logo-container">
            <img src="banco_logo_1.png" alt="Logo Banco">
        </div>
        
        <div class="info-section">
            <div class="label">Número de Cuenta</div>
            <div class="value">3216 5498 7032 7410</div>
        </div>

        <div>
            <div class="label">Titular</div>
            <div class="value">PANCHITO HERNANDEZ</div>
        </div>
    </div>

    <div class="whatsapp-section">
        <a href="https://wa.me/5545584994" class="whatsapp-link" target="_blank">
            Por favor, envía tu comprobante al WhatsApp
        </a>
    </div>

</body>
</html>
