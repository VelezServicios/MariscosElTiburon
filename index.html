<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariscos El Tiburón</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Estilos del anuncio emergente */
        #welcome-ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .ad-modal {
            position: relative;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e0e0e0;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .ad-timer {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 14px;
            color: #666666;
            font-weight: bold;
            opacity: 0.4;
        }
        .ad-image-link {
            display: block;
            margin-top: 25px;
        }
        .ad-banner-img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .ad-banner-img:hover {
            transform: scale(1.02);
        }

        /* Estilos generales de la página */
        header {
            width: 100%;
            background-color: #f0f0f0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 1px solid #e0e0e0;
        }
        nav {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: nowrap;
        }
        nav a {
            color: #000000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
            text-align: center;
            white-space: nowrap;
        }
        nav a:hover {
            color: #0077b6;
        }
        nav a i {
            font-size: 24px;
            color: #000000;
        }
        .logo-img {
            max-width: 200px;
            height: auto;
            border-radius: 50%;
        }
        main {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .branches-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .branch-card {
            flex: 1;
            min-width: 280px;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .branch-title {
            font-size: 22px;
            color: #333333;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .maps-subtitle {
            font-size: 16px;
            color: #666666;
            margin-top: 15px;
            display: block; 
            text-align: center;
            font-weight: 500;
        }
        .img-container {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        .maps-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: block;
        }
        .maps-img:hover {
            transform: scale(1.02);
        }

        /* Ajustes para versión móvil */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 10px;
            }
            .logo-img {
                max-width: 140px;
            }
            nav {
                justify-content: center;
                width: 100%;
                gap: 15px;
            }
            nav a {
                font-size: 13px;
            }
            nav a i {
                font-size: 18px;
            }
            .branch-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div id="welcome-ad-overlay">
    <div class="ad-modal">
        <div class="ad-timer" id="ad-timer-text">Cierra en 8s</div>
        
        <a href="https://wa.me/5666140182" class="ad-image-link" target="_blank" rel="noopener noreferrer">
            <img src="VELEZ_AD.jpg" alt="Anuncio Promocional" class="ad-banner-img">
        </a>
    </div>
</div>

<header>
    <div>
        <a href="#">
            <img src="MET_LOGO.png" alt="Logo Mariscos El Tiburón" class="logo-img">
        </a>
    </div>
    <nav>
        <a href="MET_PCT.html">
            <i class="fas fa-credit-card"></i> Pago con<br>Transferencia
        </a>
        <a href="MET_MENU.html">
            <i class="fas fa-utensils"></i> Menú
        </a>
        <a href="https://wa.me/5545584994" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="https://www.facebook.com/share/19pP8X9rbb/" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-facebook"></i> Facebook
        </a>
    </nav>
</header>

<main>
    <div class="branches-container">
        <!-- Sucursal Tultepec -->
        <div class="branch-card">
            <div class="branch-title">Sucursal Tultepec</div>
            <div class="img-container">
                <a href="MET_GMAPS_TULTE.html">
                    <img src="MET_GOOGLE_1.jpg" alt="Califícanos en Google Maps - Tultepec" class="maps-img">
                </a>
            </div>
            <span class="maps-subtitle">Haz clic en la imagen</span>
        </div>

        <!-- Sucursal Cuautitlán -->
        <div class="branch-card">
            <div class="branch-title">Sucursal Cuautitlán</div>
            <div class="img-container">
                <a href="MET_GMAPS_CUAUTI.html">
                    <img src="MET_GOOGLE_2.jpg" alt="Califícanos en Google Maps - Cuautitlán" class="maps-img">
                </a>
            </div>
            <span class="maps-subtitle">Haz clic en la imagen</span>
        </div>
    </div>
</main>

<script>
    let timeLeft = 8;
    const timerText = document.getElementById('ad-timer-text');
    const adOverlay = document.getElementById('welcome-ad-overlay');

    function closeAd() {
        adOverlay.style.opacity = '0';
        setTimeout(() => {
            adOverlay.style.display = 'none';
        }, 500);
    }

    const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
            timerText.innerText = `Cierra en ${timeLeft}s`;
        } else {
            timerText.innerText = '';
            clearInterval(countdown);
            closeAd();
        }
    }, 1000);
</script>

</body>
</html>
